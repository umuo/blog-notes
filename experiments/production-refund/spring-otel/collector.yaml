receivers:
    otlp:
        protocols:
            http:
                endpoint: 127.0.0.1:14318

exporters:
    debug:
        verbosity: detailed
    otlphttp/jaeger:
        endpoint: http://127.0.0.1:14319

service:
    telemetry:
        metrics:
            level: none
    pipelines:
        traces:
            receivers: [otlp]
            exporters: [debug, otlphttp/jaeger]
