    --text: #0f172a;
    --muted: #475569;
    --accent: #2563eb;

    --pub-fg: #166534;
    --plan-bg: #fef3c7;
    --plan-fg: #92400e;
  }

    --surface: #111827;
    --surface-2: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    --pub-bg: #14532d;
    --pub-fg: #bbf7d0;
    --plan-bg: #78350f;
    --plan-fg: #fde68a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
  }
  .stat-pill {
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap input {
    width: 196px;
    padding: 5px 44px 5px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    background: var(--surface);
  }
  .search-meta {
    position: absolute;
    right: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  .icon-clear {
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
    display: none;
  }
  .btn-group {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--surface-2);
    padding: 2px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .btn {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s;
  }
  .btn:hover {
    color: var(--text);
    background: rgba(148, 163, 184, 0.16);
  }
  .btn.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
  }
  .spacer { flex: 1; }
  .stage-area {
    position: relative;
    flex: 1;
    overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 20px 20px;
    cursor: grab;
    user-select: none;
  }
  .stage-area.dragging { cursor: grabbing; }
  svg#mindmap {
    width: 100%;
    height: 100%;
    display: block;
  }
  .node-g { cursor: pointer; }
  .node-rect { transition: stroke-width 0.15s, filter 0.15s, opacity 0.15s; }

    stroke-linecap: round;
    transition: opacity 0.18s;
  }
  .dimmed { opacity: 0.16; }

    bottom: 12px;

    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11.5px;
    color: var(--muted);
    box-shadow: var(--shadow);
    pointer-events: none;

    top: 14px;
    right: 14px;
    width: 340px;
    max-height: calc(100% - 28px);

    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    z-index: 15;
    display: none;

    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;

    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;

    color: var(--muted);

    height: 24px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .drawer-title {

    font-size: 15px;
    font-weight: 700;
    line-height: 1.4;

  .drawer-sec {

    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--muted);

    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;

    background: var(--surface-2);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;

  .ref-chip:hover { border-color: var(--accent); }
  .drawer-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
  }
  .action-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }
  .file-code {
    display: inline-block;
    margin-top: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--text);
  }

径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}, {"id": "art-TRN-05", "kind": "article", "code": "TRN-05", "label": "TRN-05 · LoRA 与参数高效微调", "title": "LoRA 与参数高效微调", "color": "#2563eb", "published": true, "url": "https://blog.lacknb.cn/articles/2026/11/23/1795398317459.html", "localFile": "articles/04-model-training/trn-05-lora.md", "summary": "画出冻结权重和低秩增量，用目标层、rank 和可训练参数量解释成本。比较独立 Adapter 加载、合并权重和切换 Adapter，并核对基座版本。", "refs": [], "stageOrder": 4, "stageTitle": "模型预训练与后训练", "prereq": "Tokenizer、因果语言模型、训练损失与 LE 的评测口径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}, {"id": "art-TRN-06", "kind": "article", "code": "TRN-06", "label": "TRN-06 · QLoRA、训练量化和部署量化", "title": "QLoRA、训练量化和部署量化", "color": "#2563eb", "published": true, "url": "https://blog.lacknb.cn/articles/2026/11/23/1795398359078.html", "localFile": "articles/04-model-training/trn-06-qlora-quantization.md", "summary": "用低比特冻结基座训练 LoRA，解释权重存储精度、计算精度及 Adapter 的角色。回接 F-08，区分 QLoRA、推理 PTQ、训练感知量化 QAT 和 KV Cache 量化。记录显存、质量、格式、引擎与硬件兼容性。", "refs": ["F-08"], "stageOrder": 4, "stageTitle": "模型预训练与后训练", "prereq": "Tokenizer、因果语言模型、训练损失与 LE 的评测口径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}, {"id": "art-TRN-07", "kind": "article", "code": "TRN-07", "label": "TRN-07 · 偏好数据、奖励模型与 DPO", "title": "偏好数据、奖励模型与 DPO", "color": "#2563eb", "published": true, "url": "https://blog.lacknb.cn/articles/2026/11/23/1795398360808.html", "localFile": "articles/04-model-training/trn-07-dpo-preference-data.md", "summary": "构造同一问题的 chosen/rejected，解释偏好标签、参考策略与数据偏差。比较 SFT 和 DPO 的留出集结果，注明 DPO 的离线偏好数据路径。", "refs": [], "stageOrder": 4, "stageTitle": "模型预训练与后训练", "prereq": "Tokenizer、因果语言模型、训练损失与 LE 的评测口径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}, {"id": "art-TRN-08", "kind": "article", "code": "TRN-08", "label": "TRN-08 · LLM 强化学习，从 PPO 到 GRPO", "title": "LLM 强化学习，从 PPO 到 GRPO", "color": "#2563eb", "published": true, "url": "https://blog.lacknb.cn/articles/2026/11/23/1795398362308.html", "localFile": "articles/04-model-training/trn-08-ppo-grpo.md", "summary": "讲在线采样、奖励、优势估计、策略更新与 KL 约束的作用，以 PPO 型 RLHF 和 GRPO 的组内相对奖励做对照。用可验证答案演示奖励和验证集，并检查奖励投机、输出长度和通用能力回归。", "refs": [], "stageOrder": 4, "stageTitle": "模型预训练与后训练", "prereq": "Tokenizer、因果语言模型、训练损失与 LE 的评测口径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}, {"id": "art-TRN-11", "kind": "article", "code": "TRN-11", "label": "TRN-11 · 知识蒸馏与学生模型评测", "title": "知识蒸馏与学生模型评测", "color": "#2563eb", "published": true, "url": "https://blog.lacknb.cn/articles/2026/11/23/1795398363907.html", "localFile": "articles/04-model-training/trn-11-knowledge-distillation.md", "summary": "区分教师软标签与教师生成的答案。固定学生基座、数据切分和训练预算，对照普通 SFT 与加入教师信号后的结果，报告任务收益、通用能力回归和数据成本。", "refs": [], "stageOrder": 4, "stageTitle": "模型预训练与后训练", "prereq": "Tokenizer、因果语言模型、训练损失与 LE 的评测口径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}, {"id": "art-TRN-12", "kind": "article", "code": "TRN-12", "label": "TRN-12 · 合成训练数据与质量控制", "title": "合成训练数据与质量控制", "color": "#2563eb", "published": true, "url": "https://blog.lacknb.cn/articles/2026/11/23/1795398365508.html", "localFile": "articles/04-model-training/trn-12-synthetic-training-data.md", "summary": "围绕 CSV 报告任务生成候选指令与样本，用可执行的统计结果校验答案，再做去重、覆盖率检查和人工抽查。记录生成来源、过滤规则与数据版本，用隔离的人工留出集比较仅用原始数据与加入合成数据后的效果。", "refs": [], "stageOrder": 4, "stageTitle": "模型预训练与后训练", "prereq": "Tokenizer、因果语言模型、训练损失与 LE 的评测口径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}, {"id": "art-TRN-09", "kind": "article", "code": "TRN-09", "label": "TRN-09 · 用 Unsloth 跑通一次微调、评测和导出", "title": "用 Unsloth 跑通一次微调、评测和导出", "color": "#2563eb", "published": true, "url": "https://blog.lacknb.cn/articles/2026/11/23/1795398367155.html", "localFile": "articles/04-model-training/trn-09-unsloth-finetune-export.md", "summary": "固定基座、数据、模板、硬件和依赖，用 Unsloth 做一次 LoRA 或 QLoRA SFT，与 Transformers、PEFT、TRL 的职责对照。保存 Adapter，按部署后端决定独立加载或合并，并用固定样本做导出前后回归。", "refs": [], "stageOrder": 4, "stageTitle": "模型预训练与后训练", "prereq": "Tokenizer、因果语言模型、训练损失与 LE 的评测口径", "deliverable": "跑通微型预训练和一次 Qwen 微调，产出可复现的模型版本"}]}, {" let searchQuery = "";
let matchedIds = new Set();
let nodeIndex = new Map();
let codeToId = new Map();

let viewport = { x: 24, y: 24, scale: 1 };
let dragState = null;

function indexAll(node, parent = null) {
  node._parent = parent;
  nodeIndex.set(node.id, node);
  if (node.code) codeToId.set(node.code, node.id);
  if (node.children) {
    for (const ch of node.children) indexAll(ch, node);
  }
}

function setExpandDepth(maxDepth) {
  expandedSet.clear();
  function walk(node, depth) {
    if (node.children && node.children.length > 0 && depth < maxDepth) {
      expandedSet.add(node.id);
      for (const ch of node.children) walk(ch, depth + 1);
    }
  }
  walk(TREE_DATA.root, 0);
}

function measureTextWidth(text, font) {
  mctx.font = font;
  return Math.ceil(mctx.measureText(text).width);
}

function computeNodeBox(node) {
  let font = '500 12.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
  let height = 30;
  let padX = 12;
  let badgeText = "";

  if (node.kind === "root") {
    font = '700 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
    height = 44;
    padX = 16;
    badgeText = node.badge || "";
  } else if (node.kind === "pillar") {
    font = '700 13.5px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
    height = 36;
    padX = 14;
    badgeText = node.badge || "";
  } else if (node.kind === "stage") {
    font = '600 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
    height = 32;
    padX = 12;
    badgeText = node.badge || "";
  }

  const labelW = measureTextWidth(node.label, font);
  const badgeW = badgeText ? measureTextWidth(badgeText, '600 11px sans-serif') + 18 : 0;
  const hasKids = node.children && node.children.length > 0;
  const toggleW = hasKids ? 20 : 0;
  const dotW = node.kind === "article" || node.kind === "lateral" ? 12 : 0;
  const linkIconW = node.url ? 14 : 0;

  node._w = padX * 2 + dotW + labelW + badgeW + linkIconW + toggleW;
  node._h = height;
  node._font = font;
  node._badgeText = badgeText;
  node._badgeW = badgeW;
}

function layoutVisibleTree() {
  const root = TREE_DATA.root;
  const X_GAP = 54;
  const Y_GAP = 8;
  const GROUP_GAP = 14;

  function calcSubtree(node) {
    computeNodeBox(node);
    const isExp = expandedSet.has(node.id);
    const visChildren = isExp && node.children ? node.children : [];
    node._visChildren = visChildren;
    if (visChildren.length === 0) {
      node._subH = node._h;
      return node._subH;
    }
    let total = 0;
    visChildren.forEach((ch, idx) => {
      total += calcSubtree(ch);
      if (idx < visChildren.length - 1) {
        total += ch.kind === "pillar" ? GROUP_GAP : Y_GAP;
      }
    });
    node._subH = Math.max(node._h, total);
    return node._subH;
  }

  function assignPos(node, x, topY) {
    node._x = x;
    const vis = node._visChildren;
    if (vis.length === 0) {
      node._y = topY + (node._subH - node._h) / 2;
      return;
    }
    let childrenSum = 0;
    vis.forEach((ch, idx) => {
      childrenSum += ch._subH;
      if (idx < vis.length - 1) {
        childrenSum += ch.kind === "pillar" ? GROUP_GAP : Y_GAP;
      }
    });
    let curY = topY + Math.max(0, (node._subH - childrenSum) / 2);
    const childX = x + node._w + X_GAP;
    for (const ch of vis) {
      assignPos(ch, childX, curY);
      curY += ch._subH + (ch.kind === "pillar" ? GROUP_GAP : Y_GAP);
    }
    const first = vis[0];
    const last = vis[vis.length - 1];
    const center = ((first._y + first._h / 2) + (last._y + last._h / 2)) / 2;
    node._y = center - node._h / 2;
  }

  calcSubtree(root);
  assignPos(root, 0, 0);

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  function bounds(n) {
    minX = Math.min(minX, n._x);
    minY = Math.min(minY, n._y);
    maxX = Math.max(maxX, n._x + n._w);
    maxY = Math.max(maxY, n._y + n._h);
    for (const ch of n._visChildren) bounds(ch);
  }
  bounds(root);
  return { minX, minY, maxX, maxY };
}

function isNodeHighlighted(node) {
  if (searchQuery) {
    if (matchedIds.has(node.id)) return true;
    // Keep ancestors visible
    function hasDescendantMatch(n) {
      if (matchedIds.has(n.id)) return true;
      return (n.children || []).some(hasDescendantMatch);
    }
    return hasDescendantMatch(node);
  }
  if (activeTrack === "all") return true;
  const trackStages = new Set(TREE_DATA.tracks[activeTrack] || []);
  if (node.kind === "root") return true;
  if (node.kind === "stage" || node.kind === "article") {
    return trackStages.has(node.stageOrder);
  }
  if (node.kind === "pillar") {
    return (node.children || []).some(ch => ch.kind === "stage" && trackStages.has(ch.stageOrder));
  }
  return false;
}

function svgEl(tag, attrs = {}, text = null) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v !== null && v !== undefined) el.setAttribute(k, String(v));
  }
  if (text !== null) el.textContent = text;
  return el;
}

function getThemeColors() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  return {
    cardBg: dark ? "#111827" : "#ffffff",
    cardBorder: dark ? "#334155" : "#cbd5e1",
    text: dark ? "#f1f5f9" : "#0f172a",
    muted: dark ? "#94a3b8" : "#64748b",
    badgeBg: dark ? "#1e293b" : "#f1f5f9",
    matchStroke: "#f59e0b",
    matchFill: dark ? "#2a2009" : "#fffbeb",
  };
}

function applyTransform() {
  const g = svg.querySelector("#viewport-g");
  if (g) {
    g.setAttribute("transform", `translate(${viewport.x.toFixed(1)}, ${viewport.y.toFixed(1)}) scale(${viewport.scale.toFixed(4)})`);
  }
}

function fitView(bounds) {
  const rect = stageArea.getBoundingClientRect();
  const availW = Math.max(300, rect.width - 48);
  const availH = Math.max(240, rect.height - 64);
  const treeW = Math.max(1, bounds.maxX - bounds.minX);
  const treeH = Math.max(1, bounds.maxY - bounds.minY);
  const scale = Math.min(1.08, Math.max(0.28, Math.min(availW / treeW, availH / treeH)));
  viewport.scale = scale;
  viewport.x = (rect.width - treeW * scale) / 2 - bounds.minX * scale;
  viewport.y = (rect.height - treeH * scale) / 2 - bounds.minY * scale - 8;
  applyTransform();
}

function render(shouldFit = false) {
  const bounds = layoutVisibleTree();
  const theme = getThemeColors();
  svg.innerHTML = "";
  const vpG = svgEl("g", { id: "viewport-g" });
  const linksG = svgEl("g", { id: "links-g" });
  const nodesG = svgEl("g", { id: "nodes-g" });
  vpG.appendChild(linksG);
  vpG.appendChild(nodesG);
  svg.appendChild(vpG);

  function drawLinks(node) {
    for (const ch of node._visChildren) {
      const x1 = node._x + node._w;
      const y1 = node._y + node._h / 2;
      const x2 = ch._x;
      const y2 = ch._y + ch._h / 2;
      const mx = (x1 + x2) / 2;
      const d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
      const bright = isNodeHighlighted(node) && isNodeHighlighted(ch);
      const sw = node.kind === "root" ? 2.4 : node.kind === "pillar" ? 1.7 : 1.3;
      linksG.appendChild(
        svgEl("path", {
          d,
          class: `link-path${bright ? "" : " dimmed"}`,
          stroke: ch.color || node.color,
          "stroke-width": sw,
          opacity: bright ? 0.78 : 0.16,
        })
      );
      drawLinks(ch);
    }
  }

  function drawNodes(node) {
    const bright = isNodeHighlighted(node);
    const isMatch = searchQuery && matchedIds.has(node.id);
    const isSelected = selectedId === node.id;

    const g = svgEl("g", {
      class: `node-g${bright ? "" : " dimmed"}`,
      transform: `translate(${node._x}, ${node._y})`,
      "data-id": node.id,
    });

    let fill = isMatch ? theme.matchFill : theme.cardBg;
    let stroke = isMatch ? theme.matchStroke : (node.kind === "root" || node.kind === "pillar" ? node.color : theme.cardBorder);
    let strokeW = isSelected || isMatch ? 2.2 : (node.kind === "root" ? 2.2 : node.kind === "pillar" ? 1.7 : 1.1);
    let rx = node.kind === "root" ? 12 : node.kind === "pillar" ? 10 : 8;

    if (isSelected) stroke = node.color || "#2563eb";

    g.appendChild(
      svgEl("rect", {
        class: "node-rect",
        x: 0,
        y: 0,
        width: node._w,
        height: node._h,
        rx,
        fill,
        stroke,
        "stroke-width": strokeW,
      })
    );

    // Accent bar on left for stage / pillar
    if (node.kind === "pillar" || node.kind === "stage") {
      g.appendChild(
        svgEl("rect", {
          x: 0,
          y: 0,
          width: 5,
          height: node._h,
          rx: 2,
          fill: node.color,
        })
      );
    }

    let cursorX = node.kind === "root" ? 16 : node.kind === "pillar" ? 14 : 12;
    const centerY = node._h / 2;

    if (node.kind === "article" || node.kind === "lateral") {
      const dotColor = node.published ? "#16a34a" : "#d97706";
      g.appendChild(
        svgEl("circle", {
          cx: cursorX + 3,
          cy: centerY,
          r: 3.5,
          fill: node.published ? dotColor : "none",
          stroke: dotColor,
          "stroke-width": 1.6,
        })
      );
      cursorX += 12;
    }

    const txt = svgEl(
      "text",
      {
        x: cursorX,
        y: centerY,
        "dominant-baseline": "central",
        fill: theme.text,
        style: `font:${node._font}`,
      },
      node.label
    );
    g.appendChild(txt);

    const hasKids = node.children && node.children.length > 0;
    let rightOffset = 10 + (hasKids ? 20 : 0);

    if (node.url) {
      g.appendChild(
        svgEl(
          "text",
          {
            x: node._w - rightOffset - 6,
            y: centerY,
            "dominant-baseline": "central",
            "text-anchor": "middle",
            fill: node.color || theme.muted,
            style: "font:600 11px sans-serif",
          },
          "↗"
        )
      );
    }

    if (node._badgeText) {
      const bw = node._badgeW - 4;
      const bx = node._w - rightOffset - bw;
      g.appendChild(
        svgEl("rect", {
          x: bx,
          y: centerY - 9,
          width: bw,
          height: 18,
          rx: 9,
          fill: node.kind === "root" ? node.color : theme.badgeBg,
        })
      );
      g.appendChild(
        svgEl(
          "text",
          {
            x: bx + bw / 2,
            y: centerY,
            "dominant-baseline": "central",
            "text-anchor": "middle",
            fill: node.kind === "root" ? "#ffffff" : theme.muted,
            style: "font:600 10.5px sans-serif",
          },
          node._badgeText
        )
      );
    }

    if (hasKids) {
      const isExp = expandedSet.has(node.id);
      const cx = node._w - 13;
      g.appendChild(
        svgEl("circle", {
          cx,
          cy: centerY,
          r: 7.5,
          fill: isExp ? theme.badgeBg : (node.color || "#2563eb"),
          stroke: node.color || theme.cardBorder,
          "stroke-width": 1.2,
        })
      );
      g.appendChild(
        svgEl(
          "text",
          {
            x: cx,
            y: centerY - 0.3,
            "dominant-baseline": "central",
            "text-anchor": "middle",
            fill: isExp ? theme.text : "#ffffff",
            style: "font:700 11px sans-serif",
          },
          isExp ? "−" : "+"
        )
      );
    }

    g.addEventListener("click", (ev) => {
      ev.stopPropagation();
      handleNodeClick(node);
    });
    g.addEventListener("dblclick", (ev) => {
      ev.stopPropagation();
      if (node.url) window.open(node.url, "_blank", "noopener,noreferrer");
    });

    nodesG.appendChild(g);
    for (const ch of node._visChildren) drawNodes(ch);
  }

  drawLinks(TREE_DATA.root);
  drawNodes(TREE_DATA.root);

  if (shouldFit) {
    fitView(bounds);
  } else {
    applyTransform();
  }
}

function handleNodeClick(node) {
  selectedId = node.id;
  if (node.children && node.children.length > 0 && node.kind !== "root") {
    if (expandedSet.has(node.id)) {
      expandedSet.delete(node.id);
    } else {
      expandedSet.add(node.id);
    }
  }
  render(false);
  openDrawer(node);
}

function jumpToCode(code) {
  const id = codeToId.get(code);
  if (!id) return;
  const target = nodeIndex.get(id);
  // Expand all ancestors
  let cur = target._parent;
  while (cur) {
    expandedSet.add(cur.id);
    cur = cur._parent;
  }
  selectedId = target.id;
  render(false);
  // Pan smoothly to keep target near left-center
  const rect = stageArea.getBoundingClientRect();
  viewport.x = rect.width * 0.32 - (target._x + target._w / 2) * viewport.scale;
  viewport.y = rect.height * 0.5 - (target._y + target._h / 2) * viewport.scale;
  applyTransform();
  openDrawer(target);
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function openDrawer(node) {
  const badges = [];
  if (node.code) {
    badges.push(`<span class="pill" style="background:${node.color};color:#fff">${escapeHtml(node.code)}</span>`);
  }
  if (node.kind === "article" || node.kind === "lateral") {
    badges.push(
      node.published
        ? `<span class="pill pill-pub">已发布</span>`
        : `<span class="pill pill-plan">规划待写</span>`
    );
  } else if (node.kind === "stage") {
    badges.push(`<span class="pill" style="background:${node.color};color:#fff">阶段 ${node.stageOrder} · ${escapeHtml(node.badge)}</span>`);
  } else if (node.kind === "pillar") {
    badges.push(`<span class="pill" style="background:${node.color};color:#fff">板块 · ${escapeHtml(node.badge)}</span>`);
  }

  let html = `
    <div class="drawer-head">
      <div class="drawer-badges">${badges.join("")}</div>
      <button class="drawer-close" id="drawer-close" title="关闭">×</button>
    </div>
    <h3 class="drawer-title">${escapeHtml(node.title || node.label)}</h3>
  `;

  if (node.summary) {
    html += `<div class="drawer-sec"><strong>机制与说明：</strong>${escapeHtml(node.summary)}</div>`;
  }
  if (node.prereq || node.deliverable) {
    html += `<div class="drawer-sec">
      ${node.stageTitle ? `<div><strong>所属阶段：</strong>${node.stageOrder}. ${escapeHtml(node.stageTitle)}</div>` : ""}
      ${node.prereq ? `<div><strong>先修要求：</strong>${escapeHtml(node.prereq)}</div>` : ""}
      ${node.deliverable ? `<div><strong>阶段产物：</strong>${escapeHtml(node.deliverable)}</div>` : ""}
    </div>`;
  }
  if (node.refs && node.refs.length > 0) {
    const chips = node.refs
      .map(r => `<button class="ref-chip" data-ref="${escapeHtml(r)}">→ ${escapeHtml(r)}</button>`)
      .join("");
    html += `<div class="drawer-sec"><strong>跨篇关联（点击跳转）：</strong><div class="ref-chips">${chips}</div></div>`;
  }
  if (node.localFile) {
    html += `<div class="drawer-sec"><strong>本地源文件：</strong><br><span class="file-code">${escapeHtml(node.localFile)}</span></div>`;
  }
  if (node.url) {
    html += `<div class="drawer-actions">
      <a class="action-btn primary" href="${escapeHtml(node.url)}" target="_blank" rel="noopener noreferrer">打开线上博客文章 ↗</a>
    </div>`;
  }

  drawer.innerHTML = html;
  drawer.classList.add("open");
  drawer.querySelector("#drawer-close").addEventListener("click", () => {
    drawer.classList.remove("open");
  });
  drawer.querySelectorAll(".ref-chip").forEach(btn => {
    btn.addEventListener("click", () => jumpToCode(btn.dataset.ref));
  });
}

function runSearch(q) {
  searchQuery = q.trim().toLowerCase();
  matchedIds.clear();
  searchClear.style.display = searchQuery ? "inline-block" : "none";

  if (!searchQuery) {
    searchCount.textContent = "";
    render(false);
    return;
  }

  for (const node of nodeIndex.values()) {
    const hay = `${node.code || ""} ${node.label || ""} ${node.title || ""} ${node.summary || ""} ${node.prereq || ""}`.toLowerCase();
    if (hay.includes(searchQuery)) {
      matchedIds.add(node.id);
      let cur = node._parent;
      while (cur) {
        expandedSet.add(cur.id);
        cur = cur._parent;
      }
    }
  }
  searchCount.textContent = `${matchedIds.size} 命中`;
  render(true);
}

// Toolbar events
document.querySelectorAll("[data-level]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-level]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    setExpandDepth(Number(btn.dataset.level));
    render(true);
  });
});

document.querySelectorAll("[data-track]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-track]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeTrack = btn.dataset.track;
    render(false);
  });
});

searchInput.addEventListener("input", () => runSearch(searchInput.value));
searchClear.addEventListener("click", () => {
  searchInput.value = "";
  runSearch("");
});

document.getElementById("zoom-in").addEventListener("click", () => {
  const rect = stageArea.getBoundingClientRect();
  zoomAt(rect.width / 2, rect.height / 2, 1.2);
});
document.getElementById("zoom-out").addEventListener("click", () => {
  const rect = stageArea.getBoundingClientRect();
  zoomAt(rect.width / 2, rect.height / 2, 1 / 1.2);
});
document.getElementById("zoom-fit").addEventListener("click", () => {
  const bounds = layoutVisibleTree();
  fitView(bounds);
});

const themeBtn = document.getElementById("theme-toggle");
themeBtn.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", cur);
  themeBtn.textContent = cur === "dark" ? "浅色" : "深色";
  render(false);
});

function zoomAt(cx, cy, factor) {
  const newScale = Math.min(2.5, Math.max(0.2, viewport.scale * factor));
  const actual = newScale / viewport.scale;
  viewport.x = cx - (cx - viewport.x) * actual;
  viewport.y = cy - (cy - viewport.y) * actual;
  viewport.scale = newScale;
  applyTransform();
}

stageArea.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = stageArea.getBoundingClientRect();
  const factor = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
  zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, factor);
}, { passive: false });

stageArea.addEventListener("pointerdown", (ev) => {
  if (ev.target.closest(".node-g") || ev.target.closest(".drawer")) return;
  dragState = { startX: ev.clientX, startY: ev.clientY, vx: viewport.x, vy: viewport.y };
  stageArea.classList.add("dragging");
});

window.addEventListener("pointermove", (ev) => {
  if (!dragState) return;
  viewport.x = dragState.vx + (ev.clientX - dragState.startX);
  viewport.y = dragState.vy + (ev.clientY - dragState.startY);
  applyTransform();
});

window.addEventListener("pointerup", () => {
  dragState = null;
  stageArea.classList.remove("dragging");
});

window.addEventListener("resize", () => {
  const bounds = layoutVisibleTree();
  fitView(bounds);
});

// Boot
indexAll(TREE_DATA.root, null);
setExpandDepth(2);
render(true);
</script>
</body>
</html>
